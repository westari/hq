<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ</title>
<style>
  :root {
    --bg: #0b0c0e; --card: #15171b; --line: rgba(255,255,255,.08);
    --text: #f2f2f4; --dim: #9a9ca4; --mute: #5f626a;
    --green: #34d27b; --amber: #f5b14a; --blue: #5aa2ff; --grey: #6b6f78;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 20px 28px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -.3px; }
  header .date { color: var(--dim); }
  header .spacer { flex: 1; }
  .conn { font-size: 12px; color: var(--mute); }
  .conn.ok::before { content: "● "; color: var(--green); }
  .conn.bad::before { content: "● "; color: #e5534b; }
  button.toggle { background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 24px; padding: 24px 28px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--mute); margin: 0 0 12px; font-weight: 600; }
  section { margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; }
  .card.working { border-color: rgba(52,210,123,.35); }
  .card.needs-you { border-color: rgba(245,177,74,.6); box-shadow: 0 0 0 1px rgba(245,177,74,.25), 0 0 30px rgba(245,177,74,.12); }
  .top { display: flex; align-items: center; gap: 10px; }
  .win { font-size: 17px; font-weight: 600; }
  .proj { color: var(--dim); font-size: 13px; }
  .badge { margin-left: auto; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .s-working .dot { background: var(--green); animation: pulse 1.4s infinite; }
  .s-working { background: rgba(52,210,123,.12); color: var(--green); }
  .s-needs-you .dot { background: var(--amber); animation: pulse .8s infinite; }
  .s-needs-you { background: rgba(245,177,74,.14); color: var(--amber); }
  .s-done .dot { background: var(--blue); }
  .s-done { background: rgba(90,162,255,.12); color: var(--blue); }
  .s-idle .dot { background: var(--grey); }
  .s-idle { background: rgba(255,255,255,.06); color: var(--dim); }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }
  .doing { margin: 14px 0 12px; font-size: 15px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--green); border-radius: 3px; transition: width .6s ease; }
  .card.done .bar > i { background: var(--blue); }
  .meta { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; margin-top: 8px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  ul.steps { list-style: none; padding: 0; margin: 10px 0 0; }
  ul.steps li { display: flex; gap: 10px; padding: 4px 0; font-size: 13px; }
  ul.steps li .ic { width: 16px; flex: none; text-align: center; }
  ul.steps li.completed { color: var(--mute); text-decoration: line-through; }
  ul.steps li.in_progress { color: var(--text); font-weight: 600; }
  ul.steps li.pending { color: var(--dim); }
  .prompt { margin-top: 10px; color: var(--mute); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--dim); padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 18px; }
  .pcard { display: flex; gap: 18px; align-items: center; }
  .ring { width: 74px; height: 74px; flex: none; }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .bg { stroke: rgba(255,255,255,.08); }
  .ring .fg { stroke: var(--green); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
  .ring text { fill: var(--text); font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .pname { font-size: 16px; font-weight: 600; }
  .pcount { color: var(--dim); font-size: 12px; margin: 2px 0 6px; }
  .pnext { margin: 0; padding-left: 16px; color: var(--dim); font-size: 13px; }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .feed .when { color: var(--mute); font-size: 11px; }
  .feed b { font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>HQ</h1>
  <span class="date" id="date"></span>
  <span class="spacer"></span>
  <span class="conn" id="conn">Connecting…</span>
  <button class="toggle" id="sound">Sound: on</button>
</header>
<main>
  <div>
    <section>
      <h2>Live sessions</h2>
      <div class="grid" id="sessions"></div>
    </section>
    <section>
      <h2>Projects</h2>
      <div class="grid" id="projects"></div>
    </section>
  </div>
  <aside>
    <h2>Activity</h2>
    <ul class="feed" id="feed"></ul>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const LABEL = { working: 'Working', 'needs-you': 'Needs you', done: 'Done', idle: 'Idle' };
$('date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

// ── Sound (plays when a chat finishes or needs you) ──
let soundOn = true;
try { soundOn = localStorage.getItem('hq-sound') !== 'off'; } catch {}
const renderSoundBtn = () => { $('sound').textContent = 'Sound: ' + (soundOn ? 'on' : 'off'); };
renderSoundBtn();
let audio = null;
const unlock = () => { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); };
document.addEventListener('click', unlock);
$('sound').onclick = () => { soundOn = !soundOn; try { localStorage.setItem('hq-sound', soundOn ? 'on' : 'off'); } catch {} renderSoundBtn(); };
function chime(kind) {
  if (!soundOn || !audio) return;
  const notes = kind === 'done' ? [660, 880] : [880, 660, 880];
  notes.forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = f; o.type = 'sine';
    const t = audio.currentTime + i * 0.16;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.32);
  });
}

// ── Helpers ──
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
}
function left(sec) {
  if (sec == null) return '';
  if (sec < 60) return '<1 min left';
  return '~' + Math.round(sec / 60) + ' min left';
}
function ring(pct) {
  const r = 30, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
  return `<svg class="ring" viewBox="0 0 74 74"><circle class="bg" cx="37" cy="37" r="${r}"/>
    <circle class="fg" cx="37" cy="37" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 37 37)"/>
    <text x="37" y="37">${pct}%</text></svg>`;
}
const ICON = { completed: '✓', in_progress: '▸', pending: '○' };

// ── Render ──
const lastStatus = {};
const openSteps = new Set();
function render(st) {
  // Sounds on status change
  for (const s of st.sessions) {
    const prev = lastStatus[s.id];
    if (prev && prev !== s.status && (s.status === 'done' || s.status === 'needs-you')) chime(s.status);
    lastStatus[s.id] = s.status;
  }

  $('sessions').innerHTML = st.sessions.length ? st.sessions.map((s) => {
    const pct = s.pct ?? 0;
    const steps = s.todos.length ? `
      <details data-id="${esc(s.id)}" ${openSteps.has(s.id) ? 'open' : ''}>
        <summary>Steps (${s.stepsDone}/${s.stepsTotal})</summary>
        <ul class="steps">${s.todos.map((t) => `<li class="${esc(t.status)}"><span class="ic">${ICON[t.status] || '○'}</span>${esc(t.text)}</li>`).join('')}</ul>
      </details>` : '';
    return `<div class="card ${esc(s.status)}">
      <div class="top">
        <span class="win">${esc(s.window)}</span>
        <span class="proj">${esc(s.project)}</span>
        <span class="badge s-${esc(s.status)}"><span class="dot"></span>${LABEL[s.status] || s.status}</span>
      </div>
      <div class="doing">${esc(s.doing || '—')}</div>
      ${s.stepsTotal ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}
      <div class="meta">
        <span>${s.stepsTotal ? `${pct}% · ${s.stepsDone} of ${s.stepsTotal} steps` : 'No step list yet'}${s.etaSec != null ? ' · ' + left(s.etaSec) : ''}</span>
        <span>updated ${ago(s.lastEvent)}</span>
      </div>
      ${steps}
      ${s.prompt ? `<div class="prompt" title="${esc(s.prompt)}">Job: ${esc(s.prompt)}</div>` : ''}
    </div>`;
  }).join('') : `<div class="empty">No sessions running. Start a chat in VS Code.</div>`;

  document.querySelectorAll('details[data-id]').forEach((d) => {
    d.addEventListener('toggle', () => d.open ? openSteps.add(d.dataset.id) : openSteps.delete(d.dataset.id));
  });

  $('projects').innerHTML = st.projects.map((p) => {
    const c = p.checklist;
    if (!c || c.missing) {
      return `<div class="card pcard">${ring(0)}<div><div class="pname">${esc(p.name)}</div>
        <div class="pcount">No LAUNCH.md yet</div></div></div>`;
    }
    return `<div class="card pcard">${ring(c.pct)}<div>
      <div class="pname">${esc(p.name)}</div>
      <div class="pcount">${c.done} of ${c.total} done${p.sessions.length ? ' · ' + p.sessions.map(esc).join(', ') + ' working' : ''}</div>
      ${c.next.length ? `<ol class="pnext">${c.next.map((n) => `<li>${esc(n)}</li>`).join('')}</ol>` : '<div class="pcount">Everything is checked off.</div>'}
    </div></div>`;
  }).join('');

  $('feed').innerHTML = st.activity.length ? st.activity.map((a) =>
    `<li><b>${esc(a.session)}</b> ${esc(a.text.toLowerCase())}<div class="when">${esc(a.project)} · ${new Date(a.t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</div></li>`
  ).join('') : '<li class="when">Nothing yet.</li>';
}

// ── Live connection ──
function connect() {
  const es = new EventSource('/stream');
  es.onopen = () => { $('conn').textContent = 'Live'; $('conn').className = 'conn ok'; };
  es.onmessage = (e) => render(JSON.parse(e.data));
  es.onerror = () => { $('conn').textContent = 'HQ server is off'; $('conn').className = 'conn bad'; };
}
connect();
</script>
</body>
</html>
